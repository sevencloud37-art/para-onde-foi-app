h+='<button data-mo="'+ym+'" aria-pressed="'+(ym===cur)+'" class="'+(has?"has ":"")+(ym===now?"now":"")+'" aria-label="'+label(ym,{month:"long",year:"numeric"})+'">'+label(ym,{month:"short"}).replace(".","")+'<i></i></button>';}
return h+'</div>';}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function fmtD(d,yr){if(!d)return"";var y=d.slice(0,4),m=d.slice(5,7),dd=d.slice(8,10);return(C.lang==="en"?m+"/"+dd:dd+"/"+m)+(yr?"/"+y:"");}
function fullDate(d){return fmtD(d,1);}
var CALS='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function dateField(id,val,i){return'<button type="button" class="dwrap'+(id==="dt"?"":" bdate")+'" data-dp="'+id+'"'+(i!=null?' data-i="'+i+'"':'')+'>'+CALS+'<span class="dtxt num">'+(val?fmtD(val,1):t("pickD"))+'</span></button>'+(id==="dt"?'<input type="hidden" id="dt" value="'+esc(val||"")+'">':'');}
var dp=null;
function dpHtml(){var a=dp.ym.split("-"),y=+a[0],mo=+a[1],first=new Date(y,mo-1,1).getDay(),n=dim(dp.ym),td=today(),i,h;
h='<div class="grab"></div><h2 id="sh-t">'+t(dp.k==="dt"?"date":"renY")+'</h2><p class="foot" style="text-align:center;margin:2px 0 0">'+(dp.val?fmtD(dp.val,1):"")+'</p>';
h+='<div class="month dpnav" style="margin:12px 0 10px"><button data-dpm="-12" aria-label="'+t("prevY")+'">«</button><button data-dpm="-1" aria-label="'+t("prev")+'">‹</button><span>'+label(dp.ym,{month:"long",year:"numeric"})+'</span><button data-dpm="1" aria-label="'+t("next")+'">›</button><button data-dpm="12" aria-label="'+t("nextY")+'">»</button></div>';
h+='<div class="wk" aria-hidden="true">';for(i=0;i<7;i++)h+='<span>'+new Date(2026,9,4+i).toLocaleDateString(loc(),{weekday:"narrow"})+'</span>';h+='</div><div class="days">';
for(i=0;i<first;i++)h+='<span></span>';
for(i=1;i<=n;i++){var ds=dp.ym+"-"+pad(i);h+='<button data-dpd="'+ds+'" aria-pressed="'+(ds===dp.val)+'" class="'+(ds===td?"today":"")+'" aria-label="'+fmtD(ds,1)+'">'+i+'</button>';}
return h+'</div><button class="go plain" id="sh-ok">'+t("cancel")+'</button>';}
function dpOpen(k,i){var v=k==="dt"?(D&&D.date)||today():(S.streams[+i].renew||today());dp={k:k,i:i,val:v,ym:v.slice(0,7)};sheetMode="dp";document.getElementById("sheet").innerHTML=dpHtml();document.getElementById("scrim").hidden=false;}
function dpSet(v){document.getElementById("scrim").hidden=true;
if(dp.k==="dt"){D.date=v;render();return;}
var xr=S.streams[+dp.i];if(!xr)return;var rd=+v.slice(8),nm=today().slice(0,7);while(v.slice(0,7)<nm)v=addYear(v,rd);xr.renew=v;xr.rd=rd;save();render();}
function rowHtml(x,showYear){var c0=catsOf(x)[0],cl=disp(x).map(cn).join(", "),dd=showYear?fullDate(x.date):(x.auto?t("autoL"):fullDate(x.date));
var inner=ico(c0)+'<span class="grow"><span class="t1">'+esc(x.desc||cn(disp(x)[0]))+'</span><span class="t2">'+dd+" · "+cl+'</span></span><span class="amtR num '+x.type+'">'+sgn(x)+money(x.val)+'</span>';
return x.auto?'<button class="cell" data-gobills="1">'+inner+CHEV+'</button>':'<button class="cell" data-ed="'+x.id+'">'+inner+CHEV+'</button>';}
function qHtml(){var w=norm(q).trim();if(!w)return"";
var R=S.tx.filter(function(x){return norm(x.desc).indexOf(w)>-1||norm(x.other).indexOf(w)>-1||catsOf(x).some(function(c){return norm(cn(c)).indexOf(w)>-1||norm(c).indexOf(w)>-1;})||x.date.indexOf(w)===0;}).sort(function(a,b){return a.date<b.date?1:-1;});
if(!R.length)return'<div class="grp"><div class="empty">'+t("qNone")+'</div></div>';
return'<div class="hdr">'+t("qN",R.length)+'</div><div class="grp ic">'+R.slice(0,60).map(function(x){return rowHtml(x,true);}).join("")+'</div>';}
function calHtml(){var a=cur.split("-"),y=+a[0],mo=+a[1],first=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate(),L=month(cur),td=today(),i,h;
h='<div class="grab"></div><h2 id="sh-t">'+t("calT")+'</h2><input class="srch" id="q" type="search" autocomplete="off" placeholder="'+t("qPh")+'" value="'+esc(q)+'" aria-label="'+t("qPh")+'">';
h+='<div id="qres"'+(q.trim()?"":" hidden")+'>'+qHtml()+'</div><div id="calbody"'+(q.trim()?" hidden":"")+'>';
h+='<div class="month" style="margin:10px 0"><button data-cm="-1" aria-label="'+t("prev")+'">‹</button><span>'+label(cur,{month:"long",year:"numeric"})+'</span><button data-cm="1" aria-label="'+t("next")+'">›</button></div>';
h+='<div class="wk" aria-hidden="true">';for(i=0;i<7;i++)h+='<span>'+new Date(2026,9,4+i).toLocaleDateString(loc(),{weekday:"narrow"})+'</span>';h+='</div><div class="days">';
for(i=0;i<first;i++)h+='<span></span>';
for(i=1;i<=n;i++){var ds=cur+"-"+pad(i),dl=L.filter(function(x){return x.date===ds;}),e=dl.some(function(x){return x.type==="exp";}),c=dl.some(function(x){return x.type==="inc";});
h+='<button data-day="'+ds+'" aria-pressed="'+(ds===calDay)+'" class="'+(ds===td?"today":"")+'" aria-label="'+fullDate(ds)+(dl.length?" · "+dl.length:"")+'">'+i+'<span class="dots">'+(e?'<i class="e"></i>':'')+(c?'<i class="n"></i>':'')+'</span></button>';}
h+='</div>';
if(calDay){var DL=L.filter(function(x){return x.date===calDay;});
h+='<div class="hdr">'+fullDate(calDay)+'</div><div class="grp ic">'+(DL.length?DL.map(function(x){return rowHtml(x,true);}).join(""):'<div class="empty">'+t("dayNone")+'</div>')+'</div>';}
else h+='<p class="foot">'+t("calH")+'</p>';
return h+'</div><button class="go" id="sh-ok">'+t("ok")+'</button>';}
function sheetHtml(){
function sg(attr,k,v,lab){return'<button '+attr+'="'+v+'" aria-pressed="'+(C[k]===v)+'">'+lab+'</button>';}
return'<div class="grab"></div><h2 id="sh-t">'+t("set")+'</h2>'+
'<div class="hdr">'+t("lang")+'</div><div class="seg">'+sg("data-l","lang","pt","Português")+sg("data-l","lang","en","English")+'</div>'+
'<div class="hdr">'+t("theme")+'</div><div class="seg">'+sg("data-th","theme","auto",t("auto"))+sg("data-th","theme","light",t("light"))+sg("data-th","theme","dark",t("dark"))+'</div><p class="foot">'+t("autoh")+'</p>'+
'<button class="go" id="sh-ok">'+t("ok")+'</button>';}

function render(){
materialize();
document.documentElement.lang=C.lang==="en"?"en":"pt-BR";
document.title=t("title");
document.getElementById("app-name").textContent=t("title");
document.getElementById("ttl").textContent=view==="res"?t("res"):view==="add"?t(ed?"editT":"newT"):view==="sav"?t("savT"):t("bud");
document.getElementById("gear").setAttribute("aria-label",t("set"));
document.getElementById("app").innerHTML=view==="res"?resumo():view==="add"?lancar():view==="sav"?reservas():limites();
document.querySelectorAll(".tabbar button").forEach(function(b){b.querySelector("span").textContent=t(b.dataset.v);if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
if(!noSheet&&!document.getElementById("scrim").hidden)document.getElementById("sheet").innerHTML=sheetMode==="cal"?calHtml():sheetMode==="cat"?catHtml(catSel):sheetMode==="cats"?catsEditHtml():sheetMode==="dp"?dpHtml():sheetHtml();
var mb=document.getElementById("months");if(mb){var sel=mb.querySelector("[aria-pressed=true]");if(sel)mb.scrollLeft=sel.offsetLeft-mb.clientWidth/2+sel.offsetWidth/2;}
applyTheme();}

function openEdit(id){ed=S.tx.filter(function(x){return String(x.id)===String(id);})[0]||null;if(ed){type=ed.type;D=draftFrom(ed);view="add";errK="";delArm=false;render();window.scrollTo(0,0);}}
document.getElementById("sheet").addEventListener("input",function(e){if(e.target.id!=="q")return;q=e.target.value;var r=document.getElementById("qres"),c=document.getElementById("calbody");r.innerHTML=qHtml();r.hidden=!q.trim();c.hidden=!!q.trim();});
var tt;function toast(k){var el=document.getElementById("toast");el.textContent=t(k);el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},1800);}
var newBill=-1;
function go(v){newBill=-1;view=v;ed=null;D=null;errK="";delArm=false;render();window.scrollTo(0,0);}

document.getElementById("gear").addEventListener("click",function(){sheetMode="cfg";document.getElementById("sheet").innerHTML=sheetHtml();document.getElementById("scrim").hidden=false;document.getElementById("sh-ok").focus();});
document.getElementById("scrim").addEventListener("click",function(e){
if(e.target===this||e.target.id==="sh-ok"){this.hidden=true;if(sheetMode==="cats"){readForm();render();}return;}
var bb=e.target.closest("button");
if(bb&&bb.dataset.cdel){var dc=CATS[+bb.dataset.cdel];CATS.splice(+bb.dataset.cdel,1);setCats();if(D&&!ed){var di=D.cats.indexOf(dc);if(di>-1)D.cats.splice(di,1);if(!D.cats.length)D.cats=[CATS[0]];}readForm();render();return;}
if(bb&&bb.id==="addcat"){addCat();return;}
var b=e.target.closest("button");if(!b)return;
if(b.dataset.ed){this.hidden=true;openEdit(b.dataset.ed);return;}
if(b.dataset.gobills){this.hidden=true;go("bud");return;}
if(b.dataset.dpm){dp.ym=shift(dp.ym,+b.dataset.dpm);document.getElementById("sheet").innerHTML=dpHtml();return;}
if(b.dataset.dpd){dpSet(b.dataset.dpd);return;}
if(b.dataset.cm){cur=shift(cur,+b.dataset.cm);calDay=null;render();return;}
if(b.dataset.day){calDay=b.dataset.day;render();return;}
if(b.dataset.l)C.lang=b.dataset.l;if(b.dataset.th)C.theme=b.dataset.th;saveC();readForm();render();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){document.getElementById("scrim").hidden=true;if(sheetMode==="cats"){readForm();render();}}
if(e.key==="Enter"&&e.target.id==="newcat"){e.preventDefault();addCat();}});
function addCat(){var f=document.getElementById("newcat");var n=(f&&f.value||"").trim();if(!n){catsErr("ecEmpty");return;}if(catExists(n,-1)){catsErr("ecDup");return;}
var oi=CATS.indexOf("Outros");if(oi>-1)CATS.splice(oi,0,n);else CATS.push(n);setCats();readForm();render();var nf=document.getElementById("newcat");if(nf)nf.focus();}
document.getElementById("sheet").addEventListener("change",function(e){var d=e.target.dataset;if(d.cn===undefined)return;var i=+d.cn,old=CATS[i],n=e.target.value.trim();
if(!n||catExists(n,i)){e.target.value=cn(old);catsErr(n?"ecDup":"ecEmpty");return;}catsErr("");if(n===cn(old))return;
CATS[i]=n;S.tx.forEach(function(x){if(x.cats)x.cats=x.cats.map(function(c){return c===old?n:c;});if(x.cat===old)x.cat=n;});
if(D){D.cats=D.cats.map(function(c){return c===old?n:c;});}setCats();readForm();refreshApp();});
document.querySelector(".tabbar").addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(b.dataset.v);});

document.getElementById("app").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.id==="chtog"){chOpen=!chOpen;b.setAttribute("aria-expanded",chOpen);document.getElementById("chgrid").hidden=!chOpen;document.getElementById("chfoot").hidden=!chOpen;b.querySelector(".chhint").firstChild.textContent=t(chOpen?"chHide":"chShow");return;}
if(b.dataset.cc){readForm();var c=b.dataset.cc,ix=D.cats.indexOf(c);if(ix>-1)D.cats.splice(ix,1);else D.cats.push(c);if(c==="Outros"){render();var of=document.getElementById("oth");if(of&&ix<0)of.focus();}else b.setAttribute("aria-pressed",ix<0);return;}
if(b.dataset.dp){readForm();dpOpen(b.dataset.dp,b.dataset.i);return;}
if(b.dataset.gobills){go("bud");return;}
if(b.id==="editcats"){readForm();sheetMode="cats";document.getElementById("sheet").innerHTML=catsEditHtml();document.getElementById("scrim").hidden=false;return;}
if(b.dataset.catv){sheetMode="cat";catSel=b.dataset.catv;document.getElementById("sheet").innerHTML=catHtml(catSel);document.getElementById("scrim").hidden=false;return;}
if(b.dataset.ch){var n=+b.dataset.ch,ix=S.ch.indexOf(n);if(ix>-1)S.ch.splice(ix,1);else S.ch.push(n);save();b.setAttribute("aria-pressed",ix<0);var cs=chSum();document.getElementById("chs").textContent=money(cs);document.getElementById("chb").style.width=(cs/CHMAX*100)+"%";document.getElementById("chn").textContent=t("chN",S.ch.length);document.getElementById("svtot").textContent=money(svTot());document.getElementById("svmix").innerHTML=mixHtml();return;}
if(b.dataset.m){cur=shift(cur,+b.dataset.m);render();}
else if(b.dataset.ed){openEdit(b.dataset.ed);}
else if(b.dataset.y){cur=shift(cur,12*b.dataset.y);render();}
else if(b.dataset.mo){cur=b.dataset.mo;render();}
else if(b.id==="calopen"){sheetMode="cal";calDay=null;q="";document.getElementById("sheet").innerHTML=calHtml();document.getElementById("scrim").hidden=false;}
else if(b.dataset.t){readForm();type=b.dataset.t;errK="";render();}
else if(b.id==="addst"){S.streams.push({name:"",price:0,st:true,per:"m",since:today().slice(0,7)});save();render();var f2=document.getElementById("sn"+(S.streams.length-1));if(f2)f2.focus();}
else if(b.dataset.sper){var xs=S.streams[+b.dataset.sper];xs.per=b.dataset.pv;if(xs.per==="y"&&!xs.renew){xs.renew=today();xs.rd=+today().slice(8);}keepPast(xs);save();render();}
else if(b.id==="addbill"){S.streams.push({name:"",price:0,st:false,since:today().slice(0,7)});newBill=S.streams.length-1;save();render();var f=document.getElementById("sn"+(S.streams.length-1));if(f)f.focus();}
else if(b.dataset.rmb){S.streams.splice(+b.dataset.rmb,1);newBill=-1;save();render();}
else if(b.dataset.adk){var id=Date.now();S.sav.push({id:id,kind:b.dataset.adk,name:"",val:0});save();render();var f=document.getElementById("svn"+id);if(f)f.focus();}
else if(b.dataset.rm){S.sav=S.sav.filter(function(x){return String(x.id)!==b.dataset.rm;});save();render();}
else if(b.id==="cancel"){go("res");}
else if(b.id==="delx"){if(!delArm){delArm=true;readForm();render();return;}
S.tx=S.tx.filter(function(x){return x.id!==ed.id;});save();go("res");toast("deleted");}
else if(b.id==="save"){readForm();
var v=num(D.val);
if(!(v>0)){errK="err1";render();return;}
if(!D.date){errK="err2";render();return;}
if(type==="exp"&&!D.cats.length){errK="err3";render();return;}
var o={id:ed?ed.id:Date.now(),type:type,val:Math.round(v*100)/100,cats:type==="exp"?ordCats():[type==="sav"?"Guardado":"Receita"],cat:type==="exp"?ordCats()[0]:type==="sav"?"Guardado":"Receita",other:type==="exp"&&D.cats.indexOf("Outros")>-1?(D.other||"").trim():"",date:D.date,desc:D.desc.trim(),fromW:ed&&ed.fromW?1:undefined};

cur=D.date.slice(0,7);
if(ed){S.tx=S.tx.map(function(x){return x.id===ed.id?o:x;});save();go("res");toast("savedEd");}
else{S.tx.push(o);save();var keepCat=D.cats.slice(),keepDate=D.date;D=draftFrom(null);D.cats=keepCat;D.date=keepDate;errK="";render();toast("saved");}}});

document.getElementById("app").addEventListener("change",function(e){
var d=e.target.dataset;
if(d.sst!==undefined){var bi=S.streams[+d.sst];bi.st=e.target.checked;keepPast(bi);save();render();return;}
if(d.sren!==undefined){var xr=S.streams[+d.sren],v2=e.target.value;if(!v2)return;var rd=+v2.slice(8),nm=today().slice(0,7);while(v2.slice(0,7)<nm)v2=addYear(v2,rd);xr.renew=v2;xr.rd=rd;save();render();return;}
if(d.sday!==undefined){var dv=parseInt(e.target.value,10);S.streams[+d.sday].day=dv>=1&&dv<=31?dv:undefined;e.target.value=S.streams[+d.sday].day||"";save();document.getElementById("billbox").innerHTML=billBox();return;}
if(d.sn!==undefined){S.streams[+d.sn].name=e.target.value.trim();save();document.getElementById("billbox").innerHTML=billBox();return;}
if(d.sp!==undefined){S.streams[+d.sp].price=num(e.target.value)||0;e.target.value=fmtIn(S.streams[+d.sp].price);save();document.getElementById("billbox").innerHTML=billBox();return;}
if(d.svn!==undefined||d.svv!==undefined){var it=S.sav.filter(function(x){return String(x.id)===(d.svn||d.svv);})[0];if(!it)return;
if(d.svn!==undefined)it.name=e.target.value.trim();else{it.val=num(e.target.value)||0;}save();if(d.svv!==undefined)render();return;}
if(d.w){S.water=S.water||{val:0,next:today().slice(0,7)};if(d.w==="val")S.water.val=num(e.target.value)||0;else if(e.target.value)S.water.next=e.target.value<today().slice(0,7)?today().slice(0,7):e.target.value;if(!S.water.next)S.water.next=today().slice(0,7);save();render();return;}
if(d.rate){S.rate=num(e.target.value)||0;save();render();return;}
if(d.b){var v=num(e.target.value);if(v>0)S.budget[d.b]=v;else delete S.budget[d.b];save();render();}});
document.getElementById("app").addEventListener("input",function(e){if(e.target.id==="val"&&errK){errK="";var p=document.querySelector(".err");if(p)p.textContent="";}});
function syncDate(e){var x=e.target;if(!x.classList||!x.classList.contains("dnat"))return;var l=document.getElementById(x.id+"-t");if(l)l.textContent=x.value?fmtD(x.value,1):t("pickD");}
document.addEventListener("input",syncDate,true);document.addEventListener("change",syncDate,true);
document.addEventListener("click",function(e){var x=e.target;if(x.classList&&x.classList.contains("dnat")&&x.showPicker){try{x.showPicker();}catch(_){}}},true);
setInterval(applyTheme,60000);
render();
</script>

</body></html>
